# Werewolf Deployment + Service for the homelab k3s cluster (namespace: homelab).
# Modeled on homelab/infra/k8s/api.yaml (the Node-service template).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: werewolf
  namespace: homelab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: werewolf
  template:
    metadata:
      labels:
        app: werewolf
    spec:
      containers:
        - name: werewolf
          image: localhost:30500/homelab/werewolf:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # tcpSocket (not httpGet) so the WebSocket server is probed cleanly.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: werewolf
  namespace: homelab
spec:
  selector:
    app: werewolf
  ports:
    - port: 3000
      targetPort: 3000
