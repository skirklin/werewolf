# Werewolf Deployment + Service for the homelab k3s cluster (namespace: homelab).
# Modeled on homelab/infra/k8s/api.yaml (the Node-service template).
---
# Anonymous finished-game records (one JSON line each) live here, so the stats
# survive redeploys. k3s's default local-path provisioner backs this.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: werewolf-data
  namespace: homelab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: werewolf
  namespace: homelab
spec:
  replicas: 1
  # Stop, then start: the old pod saves its live rooms to /data as it exits and
  # the new one loads them, so a deploy doesn't end games in progress. (A
  # rolling update would start the new pod first, before anything was saved,
  # and have two pods on the one volume.) Phones reconnect through the gap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: werewolf
  template:
    metadata:
      labels:
        app: werewolf
    spec:
      containers:
        - name: werewolf
          # Published by the Deploy workflow to GHCR. A rollout pins this to a
          # commit-sha tag (`kubectl set image`), so what is running is always
          # traceable to a commit and `kubectl rollout undo` goes back to one.
          # Forks: change the owner, and make the package public or add an
          # imagePullSecret.
          image: ghcr.io/skirklin/werewolf:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # tcpSocket (not httpGet) so the WebSocket server is probed cleanly.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: WEREWOLF_DATA_DIR
              value: "/data"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: werewolf-data
---
apiVersion: v1
kind: Service
metadata:
  name: werewolf
  namespace: homelab
spec:
  selector:
    app: werewolf
  ports:
    - port: 3000
      targetPort: 3000
