# Build, push and roll out to the homelab cluster.
#
# This is the workflow that holds credentials, so it is deliberately separated
# from CI and narrowly triggered:
#
#   * `workflow_run` only fires for runs in this repository, never for a pull
#     request from a fork, and always uses the workflow file from the default
#     branch — so a PR cannot edit this file into something that deploys.
#   * It runs only when CI succeeded on main, so nothing untested ships.
#   * A run started by anyone other than the repository owner must first be
#     approved on the `production-approval` environment. The owner's own
#     pushes (and manual runs) skip that gate and deploy straight away.
#     Secrets live only on the `production` environment, which the deploy job
#     reaches only once the gate has passed or been legitimately skipped.
#
# Environment settings this relies on:
#   production-approval  required reviewers; no secrets
#   production           no required reviewers; deployment branches limited
#                        to `main`; holds the secrets below
#
# The image goes to GHCR, authenticated with the run's own GITHUB_TOKEN, so
# there is no registry credential to store or to share with a laptop.
#
# Required secrets (on the `production` environment):
#   SSH_PRIVATE_KEY     deploy key for the cluster node
#   SSH_KNOWN_HOSTS     output of `ssh-keyscan <host>`, so the host is verified
#   HOMELAB_VPS         ssh target, e.g. user@host
#   SITE_URL            optional; polled for health after the rollout
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never let two rollouts race; let a newer commit wait rather than cancel,
# so a deploy is not abandoned halfway through a rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Who started this deploy: the pusher whose commit CI ran on, or whoever
# dispatched it by hand.
env:
  TRIGGERED_BY: ${{ github.event.workflow_run.triggering_actor.login || github.actor }}

jobs:
  approval:
    name: Await approval
    runs-on: ubuntu-latest
    permissions: {}
    # Only someone other than the owner needs a human to sign off.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      (github.event.workflow_run.triggering_actor.login || github.actor) != github.repository_owner
    environment: production-approval
    steps:
      - run: echo "Deploy started by $TRIGGERED_BY approved."

  deploy:
    name: Roll out to production
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A manual run is explicit consent; an automatic one requires CI to have
    # passed. Then either the approval gate passed, or it was skipped because
    # the owner started this run. `always()` lets the job run when the gate
    # was skipped; the conditions after it keep a failed or rejected gate,
    # or a cancelled run, from deploying.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      (needs.approval.result == 'success' ||
       (needs.approval.result == 'skipped' &&
        (github.event.workflow_run.triggering_actor.login || github.actor) == github.repository_owner))
    environment:
      name: production
      url: https://werewolf.example.com
    steps:
      # Deploy the commit CI actually tested, not whatever main points at now.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Issued per run and scoped to this repository's packages.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # Two tags: `latest` for anything that follows it, and the commit sha
          # so a rollout names the exact build and can be rolled back to one.
          # `github.repository` keeps the owner out of the file.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authorise ssh to the cluster
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key rather than accepting whatever answers.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Apply the manifest and roll out
        env:
          VPS: ${{ secrets.HOMELAB_VPS }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes"
          # Pin the image to this commit in the manifest itself, so one apply
          # both picks up manifest changes and ships the build — a single
          # restart (each one is a brief gap under the Recreate strategy), and
          # `kubectl rollout` still records exactly what shipped.
          sed -E "s|^( *)image: .*|\\1image: $IMAGE|" deploy/werewolf.yaml > /tmp/werewolf.yaml
          grep -qF "image: $IMAGE" /tmp/werewolf.yaml
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes /tmp/werewolf.yaml "$VPS:/tmp/werewolf.yaml"
          $SSH "$VPS" "
            set -eu
            kubectl apply -f /tmp/werewolf.yaml
            kubectl rollout status -n homelab deployment/werewolf --timeout=180s
          "

      - name: Verify the deployment is actually serving
        env:
          SITE: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          # Skipped rather than failed when SITE_URL is unset, so the rollout
          # above is still the thing that gates success.
          if [ -z "${SITE:-}" ]; then
            echo "SITE_URL not set — skipping the external check."
            exit 0
          fi
          for i in $(seq 1 20); do
            if curl -fsS "$SITE/api/health" | grep -q '"ok":true'; then
              echo "health OK at $SITE"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE never reported healthy after the rollout"
          exit 1

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
